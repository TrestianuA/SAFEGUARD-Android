name: FoniWise browser audit
on:
  push:
    branches: [test/foniwise-073-integration]
    paths:
      - 'docs/foniwise/**'
      - '.github/workflows/foniwise-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Audit prototypes
        run: |
          mkdir -p browser-results
          node docs/foniwise/browser-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foniwise-browser-results
          path: browser-results/
