name: SAFEGUARD Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Android project files
        id: project
        shell: bash
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -d app ]]; then
            echo "::notice::Android sources and Gradle wrapper are not yet committed. Build will be skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK found: $SDK_ROOT"
          ls -la "$SDK_ROOT" | head -40

      - name: Verify Gradle Wrapper
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          bash ./gradlew --version

      - name: Prepare approved logo previews for visual build
        if: steps.project.outputs.ready == 'true'
        shell: bash
        env:
          LOGO_SIMPLE_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fec833825-04a5-4051-8d76-ff42c20041ce/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJLe0jPk5ZXFidcWaCKtgogLDaZ8tMWkptDB_ZhyhBHr&exp=1795040145&osig=AAAAAAAAAAAAAAAAAAAAAGpfqFnzt8LR7Rzdxm1jDrysxmxcNRtHdWNEgbek9dDD&signer=media-rpc&token=AAIAAU0AJGVjODMzODI1LTA0YTUtNDA1MS04ZDc2LWZmNDJjMjAwNDFjZQAAAAABofC67mjBVfPk1BJUmJa3e2JfwcDmub8V1cEU72srI-nRDSbXqQ&x-canva-quality=thumbnail'
          LOGO_FULL_URL: 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F88357e6d-179a-4a99-9302-401d758c198d/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACyew5j9gdVY29fJ1YNBicJ4dA824M-gkDR-W5jGu4gT&exp=1795040101&osig=AAAAAAAAAAAAAAAAAAAAAEuTWcr5d_TwS4r-2bMhLkgWBHGFikIGza5rWXYSgFuF&signer=media-rpc&token=AAIAAU0AJDg4MzU3ZTZkLTE3OWEtNGE5OS05MzAyLTQwMWQ3NThjMTk4ZAAAAAABofC6QoiTDonDQOF2fkz3Lg4SOZS2bR59HAGJSuWOjpnSCSaisg&x-canva-quality=thumbnail'
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          if [[ ! -s app/src/main/res/drawable-nodpi/safeguard_logo_simplu.jpg && ! -s app/src/main/res/drawable-nodpi/safeguard_logo_simplu.png ]]; then
            if ! curl --fail --location --retry 3 --silent --show-error "$LOGO_SIMPLE_URL" -o app/src/main/res/drawable-nodpi/safeguard_logo_simplu.jpg; then
              echo "::error::Approved simple SAFEGUARD logo could not be downloaded. Add the original approved image to app/src/main/res/drawable-nodpi; do not replace it with a placeholder."
              exit 1
            fi
          fi
          if [[ ! -s app/src/main/res/drawable-nodpi/safeguard_logo_complet.jpg && ! -s app/src/main/res/drawable-nodpi/safeguard_logo_complet.png ]]; then
            if ! curl --fail --location --retry 3 --silent --show-error "$LOGO_FULL_URL" -o app/src/main/res/drawable-nodpi/safeguard_logo_complet.jpg; then
              echo "::error::Approved full SAFEGUARD logo could not be downloaded. Add the original approved image to app/src/main/res/drawable-nodpi; do not replace it with a placeholder."
              exit 1
            fi
          fi
          # PNG-urile originale au prioritate; evita resurse Android duplicate .png/.jpg.
          for logo in safeguard_logo_simplu safeguard_logo_complet; do
            png="app/src/main/res/drawable-nodpi/${logo}.png"
            jpg="app/src/main/res/drawable-nodpi/${logo}.jpg"
            if [[ -s "$png" && -f "$jpg" ]]; then
              rm -- "$jpg"
            fi
          done
          file app/src/main/res/drawable-nodpi/safeguard_logo_*

      - name: Build debug APK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Run debug unit tests
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Audit generated APK signature and permissions
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          {
            echo "# SAFEGUARD APK audit"
            echo
            echo "Git commit: ${GITHUB_SHA}"
            echo
            echo "## SHA-256 of APK"
            sha256sum "$apk"
            echo
            echo "## Signature verification and signer certificate"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            echo
            echo "## Package metadata"
            "$build_tools/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" || true
            echo
            echo "## Declared permissions"
            "$build_tools/aapt" dump permissions "$apk"
          } > apk-audit.txt
          cat apk-audit.txt

      - name: Upload APK audit report
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAFEGUARD-apk-audit
          path: apk-audit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAFEGUARD-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
