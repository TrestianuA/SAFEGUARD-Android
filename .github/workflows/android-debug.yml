name: SAFEGUARD Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify Android project files
        id: project
        shell: bash
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -d app ]]; then
            echo "::notice::Android sources and Gradle wrapper are not yet committed. Build will be skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK found: $SDK_ROOT"
          ls -la "$SDK_ROOT" | head -40

      - name: Verify Gradle Wrapper
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          bash ./gradlew --version

      - name: Verify committed approved logos
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/res/drawable-nodpi")
          for name in ("safeguard_logo_simplu", "safeguard_logo_complet"):
              candidates = [root / f"{name}.{ext}" for ext in ("png", "jpg")]
              existing = [path for path in candidates if path.is_file()]
              if len(existing) != 1:
                  raise SystemExit(f"Expected exactly one committed approved logo for {name}; found {len(existing)}")
              path = existing[0]
              data = path.read_bytes()
              valid = (data.startswith(bytes.fromhex("89504e470d0a1a0a")) if path.suffix == ".png"
                       else data.startswith(bytes.fromhex("ffd8ff")))
              if not valid:
                  raise SystemExit(f"Invalid image signature: {path}")
              print(f"Validated committed logo: {path} ({len(data)} bytes)")
          PY

      - name: Build debug APK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Run debug unit tests
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Audit generated APK signature and permissions
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          {
            echo "# SAFEGUARD APK audit"
            echo
            echo "Git commit: ${GITHUB_SHA}"
            echo
            echo "## SHA-256 of APK"
            sha256sum "$apk"
            echo
            echo "## Signature verification and signer certificate"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            echo
            echo "## Package metadata"
            "$build_tools/aapt" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" || true
            echo
            echo "## Declared permissions"
            "$build_tools/aapt" dump permissions "$apk"
          } > apk-audit.txt
          cat apk-audit.txt

      - name: Upload APK audit report
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SAFEGUARD-apk-audit
          path: apk-audit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SAFEGUARD-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
