name: SAFEGUARD Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project files
        id: project
        shell: bash
        run: |
          if [[ ! -f gradlew || ! -f gradle/wrapper/gradle-wrapper.jar || ! -d app ]]; then
            echo "::notice::Android sources and Gradle wrapper are not yet committed. Build will be skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK found: $SDK_ROOT"
          ls -la "$SDK_ROOT" | head -40

      - name: Verify Gradle Wrapper
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          bash ./gradlew --version

      - name: Build debug APK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAFEGUARD-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
