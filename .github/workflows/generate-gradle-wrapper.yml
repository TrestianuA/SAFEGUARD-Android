name: Generate Gradle Wrapper (8.9)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-gradle-wrapper.yml'

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Generate wrapper in isolated bootstrap directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safeguard-wrapper-bootstrap"
          cd "$RUNNER_TEMP/safeguard-wrapper-bootstrap"
          printf "rootProject.name = 'safeguard-wrapper-bootstrap'\n" > settings.gradle
          gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Install wrapper files into Android project
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/safeguard-wrapper-bootstrap"
          mkdir -p gradle/wrapper
          cp "$src/gradlew" ./gradlew
          cp "$src/gradlew.bat" ./gradlew.bat
          cp "$src/gradle/wrapper/gradle-wrapper.jar" ./gradle/wrapper/gradle-wrapper.jar
          cp "$src/gradle/wrapper/gradle-wrapper.properties" ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Commit Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper 8.9 already up to date."
            exit 0
          fi
          git commit -m "build: generate Gradle Wrapper 8.9"
          git push origin "HEAD:${GITHUB_REF_NAME}"
