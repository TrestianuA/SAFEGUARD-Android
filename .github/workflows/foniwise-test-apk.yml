name: FoniWise Android test APK

on:
  push:
    branches:
      - test/foniwise-073-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:?ANDROID_HOME is not set}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install official Nunito Sans font
        run: bash ./tools/install_nunito_sans.sh
      - name: Run unit tests and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK output
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          echo "APK exists: $apk"
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foniwise-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
