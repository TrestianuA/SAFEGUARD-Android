<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoniWise — English visual archive</title><style>*{box-sizing:border-box}body{font-family:"Nunito Sans",sans-serif;background:#F3FBF2;color:#064D2B;max-width:700px;margin:auto;padding:16px}header{background:#064D2B;color:white;padding:18px;border-radius:16px}section{background:white;border:1px solid #C5E9B6;border-radius:16px;padding:16px;margin:16px 0}svg{width:100%;height:auto}button,input{accent-color:#087C26}button{border:1px solid #087C26;border-radius:9px;padding:10px;background:#E7F8DB;color:#064D2B}button[aria-pressed=true]{background:#087C26;color:white}.bats{display:flex;justify-content:space-around}.bat{width:86px;height:104px;border:2px solid #087C26;border-radius:9px;position:relative;margin:16px auto}.bat:before{content:"";position:absolute;width:30px;height:8px;background:#087C26;top:-10px;left:26px;border-radius:3px}.fill{position:absolute;bottom:4px;left:4px;right:4px;border-radius:4px;background:#087C26}.pct{position:absolute;top:35%;width:100%;text-align:center;font-weight:bold;font-size:22px;color:#17361D;background:#ffffffb0}.dots{display:flex;gap:4px;margin:12px 0}.dots span{flex:1;text-align:center;background:#E7F8DB;border-radius:6px;padding:10px}.levels{display:flex;gap:6px}.levels button{flex:1}small{display:block}input{width:100%}</style><body><header><h1>FoniWise</h1>English visual prototypes</header><section><h2>V38 — Screen lock</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" font-family="Nunito Sans,sans-serif"><rect width="320" height="260" rx="12" fill="#F3FBF2"/><rect x="22" y="10" width="132" height="240" rx="20" fill="#064D2B"/><rect x="30" y="21" width="116" height="218" rx="13" fill="#E7F8DB"/><rect x="72" y="25" width="32" height="5" rx="2.5" fill="#064D2B"/><text font-weight="bold" x="88" y="63" text-anchor="middle" font-size="24" fill="#064D2B">10:30</text><g id="v38lock"><path d="M78 92 V83 A10 10 0 0 1 98 83 V92" fill="none" stroke="#087C26" stroke-width="4"/><rect x="72" y="92" width="32" height="25" rx="5" fill="#087C26"/><circle cx="88" cy="102" r="3" fill="white"/></g><g id="v38notice"><rect x="37" y="137" width="102" height="45" rx="6" fill="white"/><text font-weight="bold" x="45" y="153" font-size="10" fill="#064D2B">Messages</text><text id="v38message" x="45" y="169" font-size="9" fill="#064D2B">New message</text></g><g id="v38apps" display="none"><rect x="43" y="87" width="26" height="26" rx="6" fill="#087C26"/><circle cx="56" cy="100" r="5" fill="white"/><rect x="75" y="87" width="26" height="26" rx="6" fill="#72B94C"/><circle cx="88" cy="100" r="5" fill="white"/><rect x="107" y="87" width="26" height="26" rx="6" fill="#064D2B"/><circle cx="120" cy="100" r="5" fill="white"/><rect x="43" y="127" width="26" height="26" rx="6" fill="#9CCB82"/><circle cx="56" cy="140" r="5" fill="white"/><rect x="75" y="127" width="26" height="26" rx="6" fill="#087C26"/><circle cx="88" cy="140" r="5" fill="white"/><rect x="107" y="127" width="26" height="26" rx="6" fill="#72B94C"/><circle cx="120" cy="140" r="5" fill="white"/></g><rect x="176" y="38" width="132" height="51" rx="8" fill="#E7F8DB" stroke="#72B94C"/><circle cx="190" cy="55" r="5" fill="#087C26"/><text x="201" y="59" font-weight="bold" font-size="11" fill="#064D2B">Android system</text><text x="188" y="76" font-size="10" fill="#064D2B">May remain active</text><rect x="176" y="105" width="132" height="51" rx="8" fill="#E7F8DB" stroke="#72B94C"/><circle cx="190" cy="122" r="5" fill="#087C26"/><text x="201" y="126" font-weight="bold" font-size="11" fill="#064D2B">Calls</text><text x="188" y="143" font-size="10" fill="#064D2B">May remain active</text><rect x="176" y="172" width="132" height="51" rx="8" fill="#E7F8DB" stroke="#72B94C"/><circle cx="190" cy="189" r="5" fill="#087C26"/><text x="201" y="193" font-weight="bold" font-size="11" fill="#064D2B">Notifications</text><text x="188" y="210" font-size="10" fill="#064D2B">May remain active</text><rect x="67" y="229" width="42" height="4" rx="2" fill="#064D2B"/><path d="M154 64 H176 M154 131 H176 M154 198 H176" stroke="#087C26" stroke-width="2" stroke-dasharray="3 3"/></svg><label for="v38state">Phone state</label><select id="v38state"><option value="1">Locked</option><option value="0">Unlocked</option></select><label for="v38privacy">Notifications</label><select id="v38privacy"><option value="hidden">Hide content</option><option value="shown">Show content</option><option value="none">Do not show</option></select><button id="v38reset">Reset example</button><p id="v38detail" aria-live="polite"></p><script>(()=>{const e=id=>document.getElementById(id),s=e('v38state'),p=e('v38privacy');function draw(){const l=s.value==='1';e('v38lock').setAttribute('display',l?'inline':'none');e('v38apps').setAttribute('display',l?'none':'inline');e('v38notice').setAttribute('display',l&&p.value!=='none'?'inline':'none');e('v38detail').textContent=l?'Access to the user session is restricted. The system can continue to operate.':'The authenticated user can access the interface and apps.';e('v38message').textContent=p.value==='shown'?'See you at 11?':'New message'}s.onchange=p.onchange=draw;e('v38reset').onclick=()=>{s.value='1';p.value='hidden';draw()};draw()})();</script></section><section><h2>V04 — Encryption</h2><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="Nunito Sans,sans-serif"><rect width="320" height="190" rx="12" fill="#F3FBF2"/><rect class="v04part" x="9" y="14" width="91" height="145" rx="9" fill="#B5F52C"/><rect class="v04part" x="111" y="14" width="98" height="145" rx="9" fill="#E7F8DB"/><rect class="v04part" x="220" y="14" width="91" height="145" rx="9" fill="#E7F8DB"/><path d="M24 28 H65 L84 47 V132 H24Z" fill="white" stroke="#087C26"/><path d="M65 28 V47 H84" fill="#D1E6C5" stroke="#087C26"/><text x="54" y="69" text-anchor="middle" font-size="10" font-weight="bold" fill="#064D2B">MESSAGE</text><path d="M34 99 H74 M34 109 H67 M34 119 H74" stroke="#72B94C" stroke-width="2"/><text x="54" y="86" text-anchor="middle" font-size="10" fill="#064D2B">Hello!</text><path d="M145 83 V67 A15 15 0 0 1 175 67 V83" stroke="#087C26" stroke-width="6" fill="none"/><rect x="134" y="83" width="52" height="42" rx="7" fill="#064D2B"/><circle cx="160" cy="98" r="5" fill="#B5F52C"/><path d="M160 98 V111" stroke="#B5F52C" stroke-width="4"/><circle cx="143" cy="39" r="9" stroke="#087C26" stroke-width="4" fill="none"/><path d="M152 39 H185 V46 H179 V39" stroke="#087C26" stroke-width="4" fill="none"/><path id="v04paper" d="M235 28 H276 L295 47 V132 H235Z" fill="white" stroke="#087C26"/><path d="M276 28 V47 H295" fill="#9CCB82"/><text class="v04line" x="265" y="65" text-anchor="middle" font-size="10" fill="#064D2B">MESSAGE</text><text class="v04line" x="265" y="81" text-anchor="middle" font-size="10" fill="#064D2B">Hello!</text><text class="v04line" x="265" y="97" text-anchor="middle" font-size="10" fill="#064D2B">— — —</text><text class="v04line" x="265" y="113" text-anchor="middle" font-size="10" fill="#064D2B">— —</text><path d="M101 90 H110 M210 90 H219" stroke="#087C26" stroke-width="2"/><g fill="#064D2B" font-size="11" text-anchor="middle"><text x="54" y="179">Document</text><text x="160" y="179">Key</text><text x="265" y="179">Result</text></g></svg><button id="v04toggle">Simulate encryption</button><label for="v04select">Explore the components</label><select id="v04select"><option>Document</option><option>Key</option><option>Result</option></select><p id="v04detail"></p><p>Conceptual representation of encryption. Characters shown are illustrative.</p><script>(()=>{const e=id=>document.getElementById(id),x=e('v04select');let c=false;function draw(){e('v04paper').setAttribute('fill',c?'#064D2B':'white');document.querySelectorAll('.v04line').forEach((el,i)=>{el.setAttribute('fill',c?'#B5F52C':'#064D2B');el.textContent=(c?['7F A2 C9','D3 8B 04','E1 6A F2','9C B5 70']:['MESSAGE','Hello!','— — —','— —'])[i]});e('v04toggle').textContent=c?'Simulate decryption':'Simulate encryption';document.querySelectorAll('.v04part').forEach((el,i)=>el.setAttribute('fill',i===x.selectedIndex?'#B5F52C':'#E7F8DB'));e('v04detail').textContent=['The original information, which can be read and understood.','A value used by the mathematical algorithm to control the transformation of information.','After encryption, information is represented in a form that requires the appropriate key to interpret.'][x.selectedIndex]}x.onchange=draw;e('v04toggle').onclick=()=>{c=!c;draw()};draw()})();</script></section></body></html>
